# docker-compose.yml  –  desarrollo local y validación pre-Kubernetes
# Uso: docker compose up --build
#
# Variables sensibles: crea un fichero .env en la raíz con:
#   GOOGLE_CLIENT_ID=...
#   GEMINI_API_KEY=...

services:

  # ── Backend Flask ──────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: travelsense-backend
    restart: unless-stopped
    environment:
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DB_PATH=/app/data/travelsense.db
    volumes:
      - db_data:/app/data        # persistencia de SQLite
    ports:
      - "5000:5000"              # expuesto para debug; en producción solo accede el frontend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/v1/destinations"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - travelsense-net

  # ── Frontend Nginx ─────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: travelsense-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - travelsense-net

# ── Volúmenes ─────────────────────────────────────────────────────────────────
volumes:
  db_data:
    driver: local

# ── Red interna ───────────────────────────────────────────────────────────────
networks:
  travelsense-net:
    driver: bridge
