# k8s/frontend-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: travelsense-frontend
  namespace: travelsense
  labels:
    app: travelsense
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: travelsense
      tier: frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: travelsense
        tier: frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/xentesito69/isi-travelsense/frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
---
# k8s/frontend-service.yaml  (incluido aquí para mantener el frontend junto)
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: travelsense
  labels:
    app: travelsense
    tier: frontend
spec:
  selector:
    app: travelsense
    tier: frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
